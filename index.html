<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="周末搭班，帮大学生找到学校周边的单次周末兼职，提前了解班次、报酬和上岗要求。">
  <meta name="theme-color" content="#f7f8f3">
  <title>周末搭班 · 校园周边周末兼职</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%23295740'/%3E%3Cpath d='m21 8-9 13h7l-1 11 10-15h-8z' fill='%23e5f6ba'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <button class="brand" data-view="jobs" aria-label="周末搭班首页">
        <span class="brand-icon" data-icon="bolt"></span><span>周末搭班</span>
      </button>
      <nav aria-label="主导航" class="main-nav">
        <button data-view="jobs" class="current">找兼职</button>
        <button data-view="mine">我的班次</button>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn inbox-btn" data-action="messages" aria-label="消息提醒"><span data-icon="bell"></span><i id="unread" hidden></i></button>
        <button class="button merchant-link" data-view="merchant"><span data-icon="store"></span><span>商家入口</span></button>
      </div>
    </div>
  </header>
  <main id="app" class="wrap"></main>
  <footer class="wrap footer">
    <span><strong>周末搭班</strong><span class="footer-divider"> / </span>校园周边周末兼职</span>
    <span>产品演示 · 岗位为示例，操作记录保存在当前浏览器</span>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
